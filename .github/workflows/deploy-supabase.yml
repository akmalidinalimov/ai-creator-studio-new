# Supabase deploy pipeline — Phase 1 of the autonomous ops plan.
#
# On every merge to main touching supabase code, this deploys exactly what changed:
#   • Edge functions: changed function dirs (or ALL when config.toml changed — verify_jwt
#     flags live there and require redeploys). Always with the explicit prod ref, because
#     supabase/config.toml carries a stale project_id from the Lovable era.
#   • Migrations: LABEL-GATED. New files under supabase/migrations/ are applied via the
#     Management API (the same mechanism used manually until now — NEVER `supabase db push`,
#     prod's schema_migrations ledger does not track these files) only when the merged PR
#     carries the `migration-approved` label. Every applied file is recorded in the
#     ops_applied_migrations ledger, making re-runs no-ops.
#
# No-ops gracefully when SUPABASE_ACCESS_TOKEN is absent (workflows land before secrets).
# Kill-switch: disable this workflow in the Actions UI — manual deploys keep working.
#
# 2026-11-27 incident: #330 merged, and the deploy stopped at its first function — the Supabase CLI (unpinned, `npx
# supabase` = latest = 3.4.0) began asking "Confirmation required … Re-run with --yes" and cannot ask in CI, so it
# changed nothing and exited 1, which also skipped the migration step. Fixed as a class:
#   • the CLI is PINNED (SUPABASE_CLI below) and every call passes --yes: a new CLI release can no longer change the
#     pipeline under us; bumping it is a reviewed one-line change.
#   • the migration label gate checks the PR that ADDED each file (not only the newest commit's PR), and a manual
#     run (Actions → Run workflow) takes `since` = the last good commit, so a deploy that failed half-way is finished
#     through this same pipeline — never by hand.
name: Deploy Supabase (functions + migrations)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      since:
        description: "Deploy everything changed since this commit (e.g. the last commit that deployed fine). Empty = the previous commit."
        required: false
        default: ""

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: cdyidatkegxwhtuoqxly
  SUPABASE_CLI: "supabase@3.4.0"   # pinned (see the header); bump deliberately

jobs:
  deploy:
    # only ever from main: a manual run on another branch would deploy unreviewed code
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a _shared change can redeploy ~40 functions
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check secret present
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not configured — deploy pipeline is dormant (no-op)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Compute changed paths
        if: steps.gate.outputs.enabled == 'true'
        id: diff
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          # Manual run with `since`: everything changed since that commit (finishing a failed deploy).
          if [ -n "${{ github.event.inputs.since }}" ]; then
            BEFORE="${{ github.event.inputs.since }}"
            git cat-file -e "$BEFORE^{commit}" || { echo "::error::since=$BEFORE is not a commit"; exit 1; }
            git merge-base --is-ancestor "$BEFORE" HEAD || { echo "::error::since=$BEFORE is not an earlier commit of this branch"; exit 1; }
          fi
          # First push / force-push / manual dispatch: fall back to the previous commit.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          git diff --name-only "$BEFORE" "${{ github.sha }}" > changed.txt
          echo "--- changed files ---"; cat changed.txt

          # Changed function dirs (config.toml change => redeploy everything: verify_jwt lives there)
          if grep -q '^supabase/config\.toml$' changed.txt; then
            ls -1 supabase/functions | while read -r d; do
              [ -f "supabase/functions/$d/index.ts" ] && echo "$d"
            done > fns.txt
            echo "config.toml changed → deploying ALL functions"
          else
            grep '^supabase/functions/' changed.txt | cut -d/ -f3 | sort -u | while read -r d; do
              [ -f "supabase/functions/$d/index.ts" ] && echo "$d"
            done > fns.txt || true

            # A changed _shared file has no index.ts of its own, so the rule above deployed NOTHING that uses it
            # (2026-10-14: the UTF-8 fix to _shared/teacher-questions.ts would have merged green while the failing
            # teacher-questions-reminder kept running old code). Redeploy every function that imports a changed shared
            # file — directly, or through another shared file (imports are followed until nothing new turns up).
            grep '^supabase/functions/_shared/.*\.ts$' changed.txt | grep -v '\.test\.ts$'               | sed 's#^supabase/functions/_shared/##' | sort -u > shared.txt || true
            if [ -s shared.txt ]; then
              while :; do
                before=$(wc -l < shared.txt)
                while read -r f; do
                  grep -rlF "./${f}\"" supabase/functions/_shared --include='*.ts' | grep -v '\.test\.ts$'                     | sed 's#^supabase/functions/_shared/##' || true
                done < shared.txt | cat - shared.txt | sort -u > shared.next
                mv shared.next shared.txt
                [ "$(wc -l < shared.txt)" -eq "$before" ] && break
              done
              echo "--- shared files changed (with their importers) ---"; cat shared.txt
              while read -r f; do
                grep -rlF "_shared/${f}\"" supabase/functions --include='*.ts' | cut -d/ -f3 || true
              done < shared.txt | sort -u | while read -r d; do
                [ -f "supabase/functions/$d/index.ts" ] && echo "$d"
              done >> fns.txt || true
              sort -u fns.txt -o fns.txt
            fi
          fi
          echo "--- functions to deploy ---"; cat fns.txt || true

          # New migration files (added only)
          git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" \
            | grep '^supabase/migrations/.*\.sql$' | sort > migs.txt || true
          echo "--- new migrations ---"; cat migs.txt || true

          echo "has_fns=$([ -s fns.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_migs=$([ -s migs.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy changed edge functions
        if: steps.gate.outputs.enabled == 'true' && steps.diff.outputs.has_fns == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          while read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::deploy $fn"
            npx --yes "$SUPABASE_CLI" functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --yes
            echo "::endgroup::"
          done < fns.txt

      - name: Apply new migrations (label-gated, ledgered)
        if: steps.gate.outputs.enabled == 'true' && steps.diff.outputs.has_migs == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          q() { # run SQL, print response body, fail on non-2xx
            jq -n --arg q "$1" '{query:$q}' \
              | curl -sS --fail-with-body -X POST "$API" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" -d @-
          }

          # Filter to migrations NOT yet in the ledger FIRST — re-runs and dispatches over
          # already-applied files must be silent no-ops, not label-gate failures.
          : > unapplied.txt
          while read -r path; do
            [ -z "$path" ] && continue
            f=$(basename "$path")
            APPLIED=$(q "select 1 from ops_applied_migrations where filename = '$f'" | jq 'length')
            if [ "$APPLIED" != "0" ]; then
              echo "ledgered already — skipping: $f"
            else
              echo "$path" >> unapplied.txt
            fi
          done < migs.txt
          if [ ! -s unapplied.txt ]; then
            echo "All migrations already applied — nothing to do."
            exit 0
          fi

          # Gate: the merged PR that ADDED each file must carry the migration-approved label (on a push that is this
          # commit's PR, exactly as before; on a manual `since` run it is each file's own PR, never the newest one's).
          while read -r path; do
            [ -z "$path" ] && continue
            ADDED_IN=$(git log --diff-filter=A --format=%H -1 -- "$path")
            # the content applied must be EXACTLY what the labeled PR added: a later (unlabeled) edit is refused
            if [ "$(git rev-parse "${ADDED_IN}:${path}")" != "$(git rev-parse "HEAD:${path}")" ]; then
              echo "::error::$(basename "$path") changed after the PR that added it (${ADDED_IN:0:7}). NOT applying anything."
              exit 1
            fi
            LABELS=$(gh api "repos/${{ github.repository }}/commits/${ADDED_IN}/pulls" --jq '[.[].labels[].name] | join(",")' || echo "")
            echo "$(basename "$path"): added in ${ADDED_IN:0:7}, PR labels: $LABELS"
            if ! echo "$LABELS" | grep -q 'migration-approved'; then
              echo "::error::$(basename "$path") is unapplied but the PR that added it lacks the 'migration-approved' label. NOT applying anything."
              exit 1
            fi
          done < unapplied.txt

          while read -r path; do
            [ -z "$path" ] && continue
            f=$(basename "$path")
            echo "::group::migration $f"
            jq -n --rawfile sql "$path" '{query:$sql}' \
              | curl -sS --fail-with-body -X POST "$API" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H "Content-Type: application/json" -d @-
            q "insert into ops_applied_migrations (filename, commit_sha) values ('$f', '${{ github.sha }}') on conflict (filename) do nothing"
            echo "applied + ledgered"
            echo "::endgroup::"
          done < unapplied.txt

      - name: Notify owner on failure (best-effort)
        if: failure()
        env:
          OPS_NOTIFY_SECRET: ${{ secrets.OPS_NOTIFY_SECRET }}
        run: |
          [ -z "$OPS_NOTIFY_SECRET" ] && exit 0
          curl -sS --max-time 15 -X POST \
            "https://cdyidatkegxwhtuoqxly.supabase.co/functions/v1/ops-notify" \
            -H "x-ops-notify-secret: $OPS_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"🚨 Deploy pipeline FAILED on main (${{ github.sha }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
