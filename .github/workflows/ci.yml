name: CI

# Phase 1.1 — merge-blocking CI. The "cure for fix-one-break-another":
# typecheck + tests + config-check + build + the edge-function Deno tests must
# pass before merge. Lint runs advisory-only until the pre-existing `any`/empty
# -block debt is burned down to a ratcheting baseline (roadmap Phase 1.2).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · test · config · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: config.toml integrity
        run: npm run check:config

      - name: Build
        run: npm run build

      # Advisory until the pre-existing lint debt is cleared (roadmap 1.2).
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

  edge:
    name: Edge functions (Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno tests (telegram-bot-webhook)
        run: deno test supabase/functions/telegram-bot-webhook/
