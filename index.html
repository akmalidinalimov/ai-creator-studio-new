    <script>
      // Apply theme before first paint (no flash). Light is the default brand
      // look; dark only when the user explicitly chose it via the toggle.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
