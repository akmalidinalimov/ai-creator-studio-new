# --- Phase 0 (2026-06-22, M11): make pre-auth vs post-auth gateway settings explicit.
# telegram-auth & login-guard run BEFORE the user has a session -> must stay public.
# log-auth-event runs AFTER sign-in with the user's JWT -> require auth.
[functions.telegram-auth]
verify_jwt = false

[functions.login-guard]
verify_jwt = false

[functions.log-auth-event]
verify_jwt = true

# staff-intake: passwordless sales-intake form. Gated by a shared access code
# (x-intake-code, validated against INTAKE_ACCESS_CODE) exactly like sheet-sync's
# x-sheet-secret — NOT a user session. verify_jwt=false so sales staff can use the
# /intake?code=... link with no login.
[functions.staff-intake]
verify_jwt = false

# hw-dm-health: read-only health endpoint for the out-of-band GitHub Actions morning
# verifier. Gated by x-health-secret (HW_HEALTH_SECRET env) — NOT a user session.
[functions.hw-dm-health]
verify_jwt = false

# ops-notify: least-privilege Telegram notifier for the autonomous-ops pipeline. Gated by
# x-ops-notify-secret (Vault, via ops_notify_secret() RPC) — can only DM platform admins.
[functions.ops-notify]
verify_jwt = false

# ops-agent-log: records one ops-agent run outcome (x-health-secret gated) for the daily digest.
[functions.ops-agent-log]
verify_jwt = false

# reputation-check: domain-reputation monitor (Safe Browsing + VirusTotal). Cron-invoked; self-checks
# x-internal-secret. Dormant until SAFE_BROWSING_API_KEY / VIRUSTOTAL_API_KEY secrets are set.
[functions.reputation-check]
verify_jwt = false

# admin-broadcast: admin composes a course broadcast; creates the row + fans out deliveries.
# Requires a logged-in admin's JWT (verify_jwt=true) + internal role check + kill-switch.
[functions.admin-broadcast]
verify_jwt = true

# broadcast-drainer: sends pending broadcast_deliveries as Telegram DMs. Cron-invoked; self-checks
# x-internal-secret.
[functions.broadcast-drainer]
verify_jwt = false

# tg-broadcast: Telegram Mini App entry point for broadcasts. verify_jwt=false — it authenticates via
# Telegram-signed initData (HMAC bot token), not a Supabase session, then checks admin role.
[functions.tg-broadcast]
verify_jwt = false

# tg-group-board: Telegram Mini App entry point for the daily group board (stats + student leaderboards).
# verify_jwt=false — authenticates via Telegram-signed initData, then checks admin/teacher role.
[functions.tg-group-board]
verify_jwt = false

# claude-agent: task-queue API for the owner's laptop Claude Code poller. Gated by x-claude-agent-secret
# (CLAUDE_AGENT_SECRET env) — NOT a user session. Dormant until that secret is set. heartbeat/claim/report.
[functions.claude-agent]
verify_jwt = false

# submit-homework: Mini App in-app homework submission. Requires a logged-in student's Supabase
# session JWT (verify_jwt=true) — resolves the caller via auth.getUser(jwt), then writes with the
# service-role client. See supabase/functions/submit-homework/index.ts for the full contract.
[functions.submit-homework]
verify_jwt = true

# hw-image-url: resolve a homework submission's viewable image URL for the teacher Mini App (C2
# blocker). Requires a logged-in teacher/admin Supabase session JWT (verify_jwt=true) — resolves the
# caller via auth.getUser(jwt), enforces junction-aware RBAC (is_group_teacher ∪ admin), then returns
# a signed storage URL or a Telegram getFile proxy URL. See supabase/functions/hw-image-url/index.ts.
[functions.hw-image-url]
verify_jwt = true

# hw-audio-url: resolve a homework submission's voice-feedback into a playable audio URL for the
# student in-app player (Voice homework feedback, Task 4). Requires a logged-in Supabase session JWT
# (verify_jwt=true) — resolves the caller via auth.getUser(jwt), enforces RBAC (self-student ∪
# is_group_teacher ∪ admin), then returns a signed `homework-audio` storage URL or a Telegram
# getFile proxy URL. See supabase/functions/hw-audio-url/index.ts.
[functions.hw-audio-url]
verify_jwt = true

# notify-grade-voice: push an app-recorded voice feedback note to the student as a Telegram audio DM
# (Voice homework feedback, Task 6). Requires a logged-in teacher/admin Supabase session JWT
# (verify_jwt=true) — resolves the caller via auth.getUser(jwt), enforces junction-aware RBAC
# (is_group_teacher ∪ admin/superadmin, NO student-self branch — this triggers a DM), then signs a
# `homework-audio` URL and calls Telegram sendAudio server-side. Graceful no-send (200) when the
# student has no telegram_id or the submission has no voice note. See
# supabase/functions/notify-grade-voice/index.ts.
[functions.notify-grade-voice]
verify_jwt = true

# grade-card-reconcile: internal (pg_cron) BACKSTOP that heals students graded but never DM'd their
# grade card. verify_jwt=false + x-internal-secret gated (verifyInternalSecret). See
# supabase/functions/grade-card-reconcile/index.ts.
[functions.grade-card-reconcile]
verify_jwt = false

# teacher-broadcast-group: Mini App API for a teacher to DM-broadcast a message to every student in
# one of their groups (mirrors the bot-chat /tbroadcast flow exactly — a DM fan-out, NOT a post into
# the supergroup). Requires a logged-in teacher/admin Supabase session JWT (verify_jwt=true) —
# junction-aware RBAC (is_group_teacher ∪ admin/superadmin), 300-char cap, 1/hour teacher rate limit.
# See supabase/functions/teacher-broadcast-group/index.ts.
[functions.teacher-broadcast-group]
verify_jwt = true
